<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación DECA</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
        .pantalla { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; box-sizing: border-box; }
        
        /* Cortafuegos Naranja */
        #pantalla-caducado { background: #FF9800; color: white; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #pantalla-caducado h1 { font-size: 2.5rem; margin-bottom: 10px; }
        #pantalla-caducado p { font-size: 1.2rem; max-width: 500px; }
        
        /* Contenedor del Folio Válido */
        #pantalla-valido { background: white; padding: 20px; overflow-y: auto; display: block; }
        .btn-cerrar { margin-top: 20px; padding: 12px 25px; border: none; background: white; color: #FF9800; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- 1. CORTAFUEGOS NARANJA (Se activa si pasaron 7 días) -->
    <div id="pantalla-caducado" class="pantalla">
        <h1>⚠️ CÓDIGO CADUCADO</h1>
        <p>Este documento DECA ha superado el periodo de validez de 7 días ante inspección.</p>
        <button class="btn-cerrar" onclick="window.close()">Cerrar Verificación</button>
    </div>

    <!-- 2. VISOR DEL FOLIO (Solo se activa si es válido) -->
    <div id="pantalla-valido">
        <div style="max-width: 800px; margin: 0 auto; background: white; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
            <!-- Aquí pintas el botón de cerrar que mencionabas -->
            <button onclick="window.close()" style="float: right; padding: 8px 15px; background: #cc0000; color: white; border: none; border-radius: 4px; cursor: pointer;">Cerrar</button>
            
            <h2>FOLIO DE CONTROL DECA</h2>
            <hr>
            <div id="contenido-deca">
                <!-- Los datos del DECA se inyectarán aquí por JavaScript -->
                Cargando datos del documento...
            </div>
        </div>
    </div>

    <script>
        // 1. Leer los datos que vienen en el QR (ejemplo: github.io/?fecha=2026-10-20&id=123)
        const params = new URLSearchParams(window.location.search);
        const fechaParam = params.get('fecha'); // Cambia 'fecha' por tu parámetro real

        if (fechaParam) {
            const fechaDeca = new Date(fechaParam);
            const hoy = new Date();
            const diferenciaDias = Math.floor((hoy - fechaDeca) / (1000 * 60 * 60 * 24));

            // 2. EL CORTAFUEGOS: Si tiene 7 o más días de antigüedad
            if (diferenciaDias >= 7) {
                document.getElementById('pantalla-valido').style.display = 'none';
                document.getElementById('pantalla-caducado').style.display = 'flex';
            } else {
                // 3. SI ES VÁLIDO: Renderizar el Folio Deca con tus datos
                document.getElementById('contenido-deca').innerHTML = `
                    <p><strong>ID Documento:</strong> ${params.get('id') || 'N/A'}</p>
                    <p><strong>Fecha de Emisión:</strong> ${fechaParam}</p>
                    <p><strong>Estado:</strong> VÁLIDO / ACTIVO</p>
                `;
            }
        } else {
            document.getElementById('contenido-deca').innerHTML = "<p style='color:red;'>Error: Código QR no válido o sin datos de fecha.</p>";
        }
    </script>
</body>
</html>
